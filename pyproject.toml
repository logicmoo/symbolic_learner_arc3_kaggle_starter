[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logicmoo-world-workbench"
version = "0.2.0"
description = "A workbench for learning internal world models from observation and using goals to direct simulation."
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
authors = [{ name = "LogicMOO" }]
keywords = [
  "world-models",
  "goal-reasoning",
  "simulation",
  "neurosymbolic-ai",
  "arc-agi",
  "arc-agi-3",
  "prolog",
  "symbolic-ai",
  "object-memory",
  "rule-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "json-repair>=0.61.6,<0.62",
  "numpy>=1.26",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
debugger = [
  "arc-agi>=0.9.9",
  "openai>=1.0",
  "ansi2html>=1.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydevd-pycharm",
  "pywinpty>=2.0; platform_system == 'Windows'",
  "ptyprocess>=0.7; platform_system != 'Windows'",
]
notebooks = [
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
]
kaggle = [
  "arc-agi>=0.9.9",
  "kaggle>=2.2",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
]
test = [
  "pytest>=8.0",
]
all = [
  "arc-agi>=0.9.9",
  "openai>=1.0",
  "ansi2html>=1.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydevd-pycharm",
  "pywinpty>=2.0; platform_system == 'Windows'",
  "ptyprocess>=0.7; platform_system != 'Windows'",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "kaggle>=2.2",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://logicmoo.org/"
Repository = "https://github.com/logicmoo/symbolic_learner_arc3_kaggle_starter"
Issues = "https://github.com/logicmoo/symbolic_learner_arc3_kaggle_starter/issues"

[tool.setuptools]
packages = ["object_memory", "webui", "worldworkbench", "worldworkbench.adapters"]
py-modules = [
  "action_tree",
  "arc3_runner",
  "gpt_bridge",
  "image_codec",
  "interactive_runner",
  "llm_catalog_environment",
  "llm_catalog_integration",
  "llm_catalog_sampling",
  "llm_json",
  "llm_json_patch",
  "llm_key_controls",
  "llm_model_catalog",
  "llm_profile_editor",
  "llm_providers",
  "llm_readme_patch",
  "llm_transcripts",
  "llm_workflow_editor",
  "llm_workflows",
  "multillm_runner",
  "project_paths",
  "swipl_bridge",
  "unsloth_studio",
  "workflow_operation_editor",
  "workflow_operations",
]
include-package-data = true

[tool.setuptools.package-dir]
"" = "python"
webui = "webui"

[tool.setuptools.package-data]
webui = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra"
