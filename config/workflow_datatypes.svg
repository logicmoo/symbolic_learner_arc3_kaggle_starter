font-size="15">Rule set</text><text x="902" y="809" font-size="11">rule_set</text><rect x="1320" y="635" width="385" height="54" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="1332" y="658" font-size="15">Display session</text><text x="1332" y="677" font-size="11">display_session</text><rect x="1320" y="701" width="385" height="54" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="1332" y="724" font-size="15">Validation / audit / workflow reports</text><text x="1332" y="743" font-size="11">validation_report · audit_report · workflow_report</text><text x="25" y="870" font-size="20" font-weight="700">Key semantic relationship</text><text x="25" y="900" font-size="16">individual_object may be represented by image_region, turtle_program, or object_properties.</text><text x="25" y="930" font-size="16">scene aggregates image + object_collection + object_manifest.</text><text x="25" y="960" font-size="16">artifact_bundle aggregates manifests, Prolog files, Turtle programs, transition evidence, rules, and image manifests.</text></g><g transform="translate(25,1425)"><rect width="1750" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="15" y="22" font-size="13"><tspan font-weight="700">Green:</tspan> semantic representation</text><text x="15" y="43" font-size="13"><tspan font-weight="700">Purple:</tspan> collection membership   <tspan font-weight="700">Pink:</tspan> aggregate membership   Full relations are in workflow_datatypes.json</text></g></svg>
