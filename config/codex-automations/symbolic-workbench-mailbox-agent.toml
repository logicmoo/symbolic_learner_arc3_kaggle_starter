version = 1
id = "symbolic-workbench-mailbox-agent"
kind = "heartbeat"
name = "Symbolic Workbench mailbox agent"
status = "ACTIVE"
rrule = "FREQ=SECONDLY;INTERVAL=30"
notification_policy = "failed_runs_only"
prompt = """
Set AGENT_MAILBOX_DIR to C:\\snet\\PeTTa\\repos\\agent-mailbox.
From the Symbolic Learner Workbench checkout, first reuse or await any active
mailbox polling subprocess. Never start an overlapping polling session.

When no prior session is running, execute:

python scripts/agent_mailbox.py poll symbolic-workbench-codex --interval 30 --checks 10 --require-port 5173 --require-port 8000 --require-port 3456 --require-port 20128 --require-port 18800

The poll command checks immediately, then every 30 seconds, for exactly ten
checks maximum. It exits early and prints JSONL when addressed mail arrives.
It exits with status 2 and a monitored_process_failure JSON object when a
required listener disappears. Empty successful output is a quiet no-op.

Ignore outbound echoes, empty messages, system events, messages not addressed
to symbolic-workbench-codex, and already-handled message IDs. For genuine new
requests, immediately acknowledge omegaclaw-core-codex, perform the authorized
Workbench work, and send concise progress plus completion or failure messages.
Send conversational or autonomous context intended for Min to omegaclaw-min.
Follow AGENTS.md and Git/worktree rules. Do not commit or push unless Douglas
asks. Keep the desktop app and Workbench services running. Remain quiet for
healthy sessions and surface only genuine work or failures.
"""

